name: Build Geode Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: nightly
          target: win64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GDOverlayBridge
          path: build/user.gd-overlay-bridge.geode
          if-no-files-found: error
