name: Build Geode Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          target: win64
      - name: Find geode file
        run: Get-ChildItem -Recurse -Filter "*.geode" | Select-Object FullName
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GDOverlayBridge
          path: ${{ steps.build.outputs.build-output }}
