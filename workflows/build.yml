name: Build Geode Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Geode CLI
        uses: geode-sdk/action@main
        with:
          sdk: nightly
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        shell: pwsh
      - name: Build
        run: cmake --build build --config RelWithDebInfo
        shell: pwsh
      - name: Collect artifact
        run: |
          New-Item -ItemType Directory -Force -Path output
          Copy-Item build/user.gd-overlay-bridge.geode output/
        shell: pwsh
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GDOverlayBridge
          path: output/user.gd-overlay-bridge.geode
          if-no-files-found: error
