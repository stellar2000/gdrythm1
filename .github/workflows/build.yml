name: Build Geode Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Geode CLI
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/download/v3.7.4/geode-cli-v3.7.4-win.zip -o cli.zip
          7z x cli.zip -ocli
          echo "$env:GITHUB_WORKSPACE\cli" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Setup SDK
        run: |
          mkdir -p cli-profile/geode/mods
          geode profile add --name GithubActions "$env:GITHUB_WORKSPACE/cli-profile/GeometryDash.exe" win
          geode sdk install "$env:GITHUB_WORKSPACE/geode-sdk-clone"
          geode sdk update nightly
          geode sdk install-binaries --platform win
        shell: pwsh

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        shell: pwsh
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk-clone

      - name: Build
        run: cmake --build build --config RelWithDebInfo
        shell: pwsh
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk-clone

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GDOverlayBridge
          path: build/user.gd-overlay-bridge.geode
          if-no-files-found: error
